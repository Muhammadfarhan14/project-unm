<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <title>Dashboard Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
<script>
document.getElementById('formTambahMeja').addEventListener('submit', function(event) {
    event.preventDefault();

    const nomorMeja = document.getElementById('nomorMeja').value;

    if (nomorMeja.trim() === '') {
        alert('Nomor Meja tidak boleh kosong!');
        return;
    }

    // TODO: Tambahkan logika untuk menambahkan meja ke daftar (misalnya: render kartu QR, simpan ke database, dll)
    alert('Meja ' + nomorMeja + ' berhasil ditambahkan!');

    // Reset dan tutup modal
    this.reset();
    const modal = bootstrap.Modal.getInstance(document.getElementById('modalTambahMeja'));
    modal.hide();
});
</script>


    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background-color: #f5f7fa;
        }

        .sidebar {
            width: 220px;
            min-height: 100vh;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .card h5 {
            font-weight: 600;
        }

        .card h2 {
            font-weight: bold;
        }

        .navbar input[type="search"] {
            border-radius: 20px;
            padding-left: 15px;
        }

        #menuCollapse a {
            font-size: 0.95rem;
            color: #444;
        }

        #menuCollapse a:hover {
            background-color: #e9ecef;
            border-radius: 5px;
        }

        .card img {
            max-width: 100%;
            border-radius: 5px;
        }

        .card {
            border-radius: 10px;
        }

        .card button {
            width: 40px;
            height: 35px;
        }
    </style>
</head>

<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="bg-light border-end sidebar" id="sidebar-wrapper">
            <div class="sidebar-heading text-primary fw-bold p-3">Admin</div>
            <div class="list-group list-group-flush">
                <a href="admin.html" class="list-group-item list-group-item-action"><i
                        class="fas fa-home me-2"></i>Dashboard</a>
                <a href="#" class="list-group-item list-group-item-action"><i class="fas fa-cart-plus me-2"></i>Pesanan
                    Baru</a>
                <a href="#" class="list-group-item list-group-item-action"><i class="fas fa-receipt me-2"></i>Rekap
                    Pesanan</a>

                <!-- Dropdown Menu -->
                <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                    data-bs-toggle="collapse" href="#menuCollapse" role="button" aria-expanded="false"
                    aria-controls="menuCollapse">
                    <div><i class="fas fa-book me-2"></i>Menu</div>
                    <i class="fas fa-chevron-down"></i>
                </a>
                <div class="collapse ps-4" id="menuCollapse">
                    <a href="tambahmakanan.html" class="list-group-item list-group-item-action border-0 bg-transparent"><i
                            class="fas fa-utensils me-2"></i>Makanan</a>
                    <a href="#" class="list-group-item list-group-item-action border-0 bg-transparent"><i
                            class="fas fa-coffee me-2"></i>Minuman</a>
                </div>

                <a href="#" class="list-group-item list-group-item-action"><i class="fas fa-chair me-2"></i>List
                    Meja</a>
                <a href="#" class="list-group-item list-group-item-action"><i class="fas fa-university me-2"></i>List
                    Bank</a>
            </div>
        </div>

        <!-- Page Content -->
        <div id="page-content-wrapper" class="w-100">
            <nav class="navbar navbar-light bg-white border-bottom justify-content-between px-4 py-3">
                <input class="form-control w-50" type="search" placeholder="Type to search..." aria-label="Search" />
                <div class="d-flex align-items-center">
                    <img src="https://via.placeholder.com/40" class="rounded-circle" alt="Admin" width="40"
                        height="40" />
                    <span class="ms-2 fw-bold">Admin Kasir</span>
                </div>
            </nav>

            <div class="container-fluid px-4 py-4">

                <!-- Tombol Tambah List Meja -->
                <div class="mb-4">
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalTambahMeja">
                        <i class="fas fa-plus"></i> Tambah List Meja
                    </button>
                </div>

                <!-- Modal Tambah Meja -->
                <div class="modal fade" id="modalTambahMeja" tabindex="-1" aria-labelledby="modalTambahMejaLabel"
                    aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">

                            <div class="modal-header">
                                <h5 class="modal-title" id="modalTambahMejaLabel">Tambah Meja</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                            </div>

                            <div class="modal-body">
                                <form id="formTambahMeja">
                                    <div class="mb-3">
                                        <label for="nomorMeja" class="form-label">Nomor Meja</label>
                                        <input type="text" class="form-control" id="nomorMeja" placeholder="Contoh 01"
                                            required>
                                    </div>
                                </form>
                            </div>

                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                <button type="submit" form="formTambahMeja" class="btn btn-primary">Tambah</button>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- Kartu QR Meja -->
                <div class="card shadow-sm p-3" style="width: 250px;">
                    <div class="d-flex justify-content-center">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?data=https://contoh-link/meja01&size=200x200"
                            alt="QR Meja" class="img-fluid">
                    </div>
                    <p class="text-center text-danger fw-semibold mt-2">Meja 01</p>
                    <div class="d-flex justify-content-around mt-3">
                        <button class="btn btn-sm btn-info text-white"><i class="fas fa-download"></i></button>
                        <button class="btn btn-sm btn-primary"><i class="fas fa-link"></i></button>
                        <button class="btn btn-sm btn-danger"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>

</html>
