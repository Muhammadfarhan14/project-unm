<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Self Order</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #8B3A3A;
      color: #fff;
    }

    header {
      text-align: center;
      font-size: 20px;
      padding: 10px;
      background-color: #8B3A3A;
      color: orange;
    }

    .queue-box {
      position: absolute;
      top: 0;
      right: 0;
      background-color: orange;
      color: white;
      font-size: 24px;
      padding: 10px 20px;
      font-weight: bold;
    }

    .search-container {
      display: flex;
      justify-content: space-around;
      padding: 20px;
    }

    .search-container input {
      width: 40%;
      padding: 10px;
      border-radius: 5px;
      border: none;
      font-size: 16px;
    }

    .menu-container {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      padding: 20px;
    }

    .card {
      background-color: #a04949;
      width: 250px;
      border-radius: 8px;
      margin: 10px;
      padding: 10px;
      text-align: center;
      color: white;
    }

    .card img {
      width: 100%;
      height: 150px;
      border-radius: 5px;
      object-fit: cover;
    }

    .card h3 {
      margin: 10px 0 5px;
      color: gold;
    }

    .card p {
      margin: 5px 0;
    }

    .plus-button {
      background-color: orange;
      border: none;
      padding: 5px 10px;
      font-size: 20px;
      border-radius: 4px;
      cursor: pointer;
    }

    .floating-buttons {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .floating-button {
      background-color: orange;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: white;
      position: relative;
    }

    .floating-button::after {
      content: '0';
      position: absolute;
      bottom: 2px;
      right: 2px;
      background-color: red;
      width: 18px;
      height: 18px;
      font-size: 12px;
      border-radius: 50%;
      text-align: center;
    }

    /* ===== Category Pills ===== */
    .nav-category .nav-link {
      color: #000;
      font-weight: 600;
      border-radius: 999rem;
      padding: .6rem 2.4rem;
    }

    .nav-category .nav-link.active {
      background: var(--primary-red);
      color: #fff;
    }

    :root {
      --primary-red: #cc0000;
    }

    /* ===== Common =====
    body.modal-open .dim-when-modal { filter:brightness(.25); }
    .icon-search{ font-size:1.4rem;color:var(--primary-red);}   */
  </style>
</head>

<body>

  <div class="queue-box">02</div>

  <header>Antiran Ke-0</header>

  <div class="container">
    <ul class="nav nav-pills justify-content-center nav-category mb-4 gap-3 flex-nowrap overflow-auto">
      <li class="nav-item"><a class="nav-link active" href="#">COFFEE</a></li>
      <li class="nav-item"><a class="nav-link" href="#">MAKANAN</a></li>
      <li class="nav-item"><a class="nav-link" href="#">NON COFFEE</a></li>
    </ul>
  </div>

  <div class="menu-container">
    <!-- Makanan -->
    <div class="card">
      <img src="https://sanex.co.id/wp-content/uploads/2024/11/2734.jpg" alt="Nasi Goreng">
      <h3>Nasi Goreng</h3>
      <p>Rp. 10.000 / Porsi</p>
      <p>Stok: 10 Porsi</p>
      <button class="plus-button">+</button>
    </div>

    <!-- Minuman -->
    <div class="card">
      <img
        src="https://cdn.rri.co.id/berita/Palu/o/1719322048584-WhatsApp_Image_2024-06-25_at_18.35.52_(1)/j7nhx0ok275rz32.jpeg"
        alt="Es Teh">
      <h3>Es Teh</h3>
      <p>Rp. 2.000 / Porsi</p>
      <p>Stok: 10 Porsi</p>
      <button class="plus-button">+</button>
    </div>
  </div>

  <!-- Floating Buttons -->
  <div class="floating-buttons">
    <div class="floating-button" title="Pesanan">🧾</div>
    <div class="floating-button" title="Keranjang">🛒</div>
  </div>

</body>

</html>
