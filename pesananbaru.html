<script>
document.getElementById('formTambahMeja').addEventListener('submit', function(event) {
    event.preventDefault();

    const nomorMeja = document.getElementById('nomorMeja').value;

    if (nomorMeja.trim() === '') {
        alert('Nomor Meja tidak boleh kosong!');
        return;
    }

    // TODO: Tambahkan logika untuk menambahkan meja ke daftar (misalnya: render kartu QR, simpan ke database, dll)
    alert('Meja ' + nomorMeja + ' berhasil ditambahkan!');

    // Reset dan tutup modal
    this.reset();
    const modal = bootstrap.Modal.getInstance(document.getElementById('modalTambahMeja'));
    modal.hide();
});
</script>
