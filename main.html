<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Self‑Order Demo (Menu + Order + Cart)</title>

  <!-- Bootstrap 5 & Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

  <style>
    :root { --primary-red:#d50000; }

    /* ===== Common ===== */
    body.modal-open .dim-when-modal { filter:brightness(.25); }
    .icon-search{ font-size:1.4rem;color:var(--primary-red);}  

    /* ===== Navbar ===== */
    .navbar .nav-link{font-weight:600;color:#000;}

    /* ===== Category Pills ===== */
    .nav-category .nav-link{color:#000;font-weight:600;border-radius:999rem;padding:.6rem 2.4rem;}
    .nav-category .nav-link.active{background:var(--primary-red);color:#fff;}

    /* ===== Menu Card ===== */
    .card-menu{background:#f4dfe3;border:none;}
    .card-menu img{opacity:.5;}
    .btn-tambah{border:2px solid var(--primary-red);color:var(--primary-red);font-weight:600;}
    .btn-tambah:hover{background:var(--primary-red);color:#fff;}

    /* ===== Location Pill ===== */
    .location-pill{background:#f1f1f1;border-radius:999rem;padding:.4rem 1.4rem;display:inline-flex;align-items:center;gap:.4rem;font-weight:600;}
    .location-pill .fa-map-pin{color:var(--primary-red);}

    /* ===== Order Modal ===== */
    .order-modal .modal-content{border-radius:28px;border:none;overflow:hidden;max-width:560px;margin:auto;}
    .order-modal .modal-header{border:0;background:#f4dfe3;justify-content:center;position:relative;}
    .order-modal .close-btn{position:absolute;top:18px;right:18px;background:var(--primary-red);color:#fff;border:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;}
    .order-img-placeholder{width:70%;max-width:300px;margin:30px auto 10px;opacity:.5;}
    .order-title{font-size:1.75rem;font-weight:600;}
    .qty-btn{border:2px solid #d3d3d3;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:#9e9e9e;background:#fff;}
    .qty-btn.active{border-color:var(--primary-red);color:#fff;background:var(--primary-red);}  
    .buy-btn{background:var(--primary-red);color:#fff;font-weight:600;border:none;border-radius:34px;padding:14px 0;font-size:1.1rem;}

    /* ===== Cart Modal ===== */
    .cart-modal .modal-content{border-radius:28px;border:none;overflow:hidden;max-width:640px;margin:auto;}
    .cart-modal .modal-header{border:0;padding:20px 28px;}
    .back-btn{background:var(--primary-red);color:#fff;border:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
    .cart-title{flex:1;text-align:center;font-size:1.7rem;font-weight:700;color:var(--primary-red);}   
    .cart-body{padding:0 28px 24px;max-height:420px;overflow-y:auto;}
    .cart-item{display:flex;align-items:center;padding:22px 0;border-bottom:1px solid #eee;gap:18px;}
    .mini-img{width:90px;height:90px;background:#f4dfe3;display:flex;align-items:center;justify-content:center;}
    .mini-img img{width:60%;opacity:.5;}
    .cart-item h6{font-weight:600;color:var(--primary-red);margin-bottom:4px;}
    .price-each{color:var(--primary-red);font-weight:600;font-size:.9rem;}
    .remove-btn{color:var(--primary-red);cursor:pointer;}
    .cart-qty-btn{border:2px solid #d3d3d3;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:#9e9e9e;background:#fff;}
    .cart-qty-btn.active{border-color:var(--primary-red);color:#fff;background:var(--primary-red);}  
    .note-input{border:0;border-bottom:1px solid #ddd;width:100%;outline:none;font-size:.9rem;padding:6px 0;}
    .summary-row{display:flex;justify-content:space-between;padding:4px 0;font-weight:600;}
    .checkout-btn{background:var(--primary-red);color:#fff;font-weight:600;border:none;border-radius:34px;padding:16px 0;font-size:1.1rem;margin-top:18px;width:100%;}
  </style>
</head>
<body class="dim-when-modal">

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
    <div class="container-fluid px-4">
      <div class="d-flex gap-4 align-items-center flex-grow-1">
        <a class="nav-link" href="#">BERANDA</a>
        <a class="nav-link" href="#">TENTANG</a>
      </div>
      <a class="navbar-brand mx-auto" href="#"><img src="https://dummyimage.com/100x40/000/fff&text=BOTHLAM+SPACE" height="40" alt="Logo"/></a>
      <span class="icon-search"><i class="fa-solid fa-magnifying-glass"></i></span>
    </div>
  </nav>

  <!-- ===== LOCATION ===== -->
  <div class="container my-4 text-center">
    <span class="location-pill"><i class="fa-solid fa-map-pin"></i> BOTHLAM SPACE BOTLEM &bull; DENAH MEJA A &bull; MEJA 01</span>
  </div>

  <!-- ===== CATEGORY PILLS ===== -->
  <div class="container">
    <ul class="nav nav-pills justify-content-center nav-category mb-4 gap-3 flex-nowrap overflow-auto">
      <li class="nav-item"><a class="nav-link active" href="#">COFFEE</a></li>
      <li class="nav-item"><a class="nav-link" href="#">MAKANAN</a></li>
      <li class="nav-item"><a class="nav-link" href="#">NON COFFEE</a></li>
    </ul>
  </div>

  <!-- ===== MENU GRID ===== -->
  <div class="container">
    <div class="row g-4">
      <!-- contoh 1 -->
      <div class="col-6 col-md-4 col-lg-2">
        <div class="card card-menu text-center h-100 p-3">
          <img src="https://dummyimage.com/200x200/f4dfe3/ffffff&text=%F0%9F%8D%B5" class="card-img-top" alt="Avocado"/>
          <div class="card-body d-flex flex-column justify-content-between">
            <h6 class="card-title text-danger fw-bold mb-1">Avocado</h6>
            <p class="mb-3">35.000</p>
            <button class="btn btn-tambah w-100 open-order" data-name="Avocado" data-price="35000"><i class="fa-solid fa-bag-shopping"></i> TAMBAH</button>
          </div>
        </div>
      </div>
      <!-- produk lain bisa ditambahkan -->
    </div>
  </div>

  <!-- ===== ORDER MODAL ===== -->
  <div class="modal fade order-modal" id="orderModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header p-0 flex-column">
          <img src="https://dummyimage.com/400x250/f4dfe3/ffffff&text=%F0%9F%8D%B5" class="order-img-placeholder" alt="img"/>
          <button type="button" class="close-btn" data-bs-dismiss="modal"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body text-center pb-4">
          <h4 class="order-title mb-4">Item</h4>
          <p class="text-muted mb-1" style="letter-spacing:1px;font-size:.8rem;">JUMLAH</p>
          <div class="d-flex justify-content-center align-items-center gap-4 mb-4">
            <button class="qty-btn minus" disabled><i class="fa-solid fa-minus"></i></button>
            <span id="qtyDisplay" style="font-size:1.25rem;font-weight:600;">1</span>
            <button class="qty-btn plus active"><i class="fa-solid fa-plus"></i></button>
          </div>
          <button class="buy-btn w-100" id="buyBtn">BELI Rp <span id="buyTotal">0</span></button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== CART MODAL ===== -->
  <div class="modal fade cart-modal" id="cartModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <button class="back-btn" data-bs-dismiss="modal"><i class="fa-solid fa-arrow-left"></i></button>
          <h5 class="cart-title">KERANJANG</h5>
          <span id="itemCount" class="fw-semibold text-muted" style="font-size:.9rem;">0 BARANG</span>
        </div>
        <div class="cart-body" id="cartItems"><!-- items injected here --></div>
        <div class="px-4 py-3" style="border-top:1px solid #eee;">
          <div class="summary-row"><span>SUBTOTAL</span><span id="subtotalDisplay">Rp 0</span></div>
          <div class="summary-row"><span>TOTAL</span><span id="totalDisplay">Rp 0</span></div>
          <button class="checkout-btn">CHECKOUT</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== BOOTSTRAP & CORE JS ===== -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const orderModalEl=document.getElementById('orderModal');
    const cartModalEl=document.getElementById('cartModal');
    const orderModal=new bootstrap.Modal(orderModalEl);
    const cartModal=new bootstrap.Modal(cartModalEl);

    // Elements in order modal
    const qtyDisp=document.getElementById('qtyDisplay');
    const minusBtn=orderModalEl.querySelector('.minus');
    const plusBtn=orderModalEl.querySelector('.plus');
    const buyTotal=document.getElementById('buyTotal');
    const buyBtn=document.getElementById('buyBtn');
    let currentItem={name:'',price:0,qty:1};
    let cart=[];

    // open order modal
    document.querySelectorAll('.open-order').forEach(btn=>{
      btn.addEventListener('click',()=>{
        currentItem.name=btn.dataset.name;
        currentItem.price=parseInt(btn.dataset.price,10);
        currentItem.qty=1;
        orderModalEl.querySelector('.order-title').textContent=currentItem.name;
        qtyDisp.textContent=1; minusBtn.disabled=true;
        buyTotal.textContent=currentItem.price.toLocaleString('id-ID');
        orderModal.show();
      });
    });

    // qty controls
    function updateQtyDisplay(){
      qtyDisp.textContent=currentItem.qty;
      buyTotal.textContent=(currentItem.price*currentItem.qty).toLocaleString('id-ID');
      minusBtn.disabled=currentItem.qty===1;
    }
    minusBtn.addEventListener('click',()=>{if(currentItem.qty>1){currentItem.qty--;updateQtyDisplay();}});
    plusBtn.addEventListener('click',()=>{currentItem.qty++;updateQtyDisplay();});

    // add to cart + open cart modal
    buyBtn.addEventListener('click',()=>{
      // check existing
      const existing=cart.find(i=>i.name===currentItem.name);
      if(existing){existing.qty+=currentItem.qty;}else{cart.push({...currentItem});}
      orderModal.hide();
      renderCart();
      cartModal.show();
    });

    // render cart
    function renderCart(){
      const cartItemsEl=document.getElementById('cartItems');
      cartItemsEl.innerHTML='';
      let subtotal=0;
      cart.forEach((item,index)=>{
        subtotal+=item.price*item.qty;
        const row=document.createElement('div');
        row.className='cart-item';
        row.innerHTML=`
          <div class="mini-img"><img src='https://dummyimage.com/70x70/f4dfe3/ffffff&text=%F0%9F%8D%B5'></div>
          <div class="flex-grow-1">
            <h6>${item.name}</h6>
            <div class="d-flex align-items-center gap-2 mb-1">
              <button class="cart-qty-btn minus${index}"><i class='fa-solid fa-minus'></i></button>
              <span id='cartQty${index}' style='min-width:18px;text-align:center;'>${item.qty}</span>
              <button class="cart-qty-btn active plus${index}"><i class='fa-solid fa-plus'></i></button>
              <span class="price-each ms-2">@Rp ${item.price.toLocaleString('id-ID')}</span>
              <span class="remove-btn ms-auto" id='remove${index}'><i class='fa-solid fa-trash'></i></span>
            </div>
            <input type='text' class='note-input' placeholder='Tambah catatan (optional)'>
          </div>
          <div class='fw-semibold text-end' style='min-width:90px;'>Rp ${(item.price*item.qty).toLocaleString('id-ID')}</div>`;
        cartItemsEl.appendChild(row);

        // qty btns
        row.querySelector('.minus'+index).addEventListener('click',()=>{if(item.qty>1){item.qty--;renderCart();}});
        row.querySelector('.plus'+index).addEventListener('click',()=>{item.qty++;renderCart();});
        row.querySelector('#remove'+index).addEventListener('click',()=>{cart.splice(index,1);renderCart();});
      });

      document.getElementById('itemCount').textContent=`${cart.length} BARANG`;
      document.getElementById('subtotalDisplay').textContent=`Rp ${subtotal.toLocaleString('id-ID')}`;
      document.getElementById('totalDisplay').textContent=`Rp ${subtotal.toLocaleString('id-ID')}`;
    }
  </script>
</body>
</html>
