<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <title>Dashboard Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background-color: #f5f7fa;
        }

        .sidebar {
            width: 220px;
            min-height: 100vh;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .card h5 {
            font-weight: 600;
        }

        .card h2 {
            font-weight: bold;
        }

        .navbar input[type="search"] {
            border-radius: 20px;
            padding-left: 15px;
        }

        #menuCollapse a {
            font-size: 0.95rem;
            color: #444;
        }

        #menuCollapse a:hover {
            background-color: #e9ecef;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="bg-light border-end sidebar" id="sidebar-wrapper">
            <div class="sidebar-heading text-primary fw-bold p-3">Admin</div>
            <div class="list-group list-group-flush">
                <a href="admin.html" class="list-group-item list-group-item-action"><i
                        class="fas fa-home me-2"></i>Dashboard</a>
                <a href="#" class="list-group-item list-group-item-action"><i class="fas fa-cart-plus me-2"></i>Pesanan
                    Baru</a>
                <a href="#" class="list-group-item list-group-item-action"><i class="fas fa-receipt me-2"></i>Rekap
                    Pesanan</a>

                <!-- Dropdown Menu -->
                <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                    data-bs-toggle="collapse" href="#menuCollapse" role="button" aria-expanded="false"
                    aria-controls="menuCollapse">
                    <div><i class="fas fa-book me-2"></i>Menu</div>
                    <i class="fas fa-chevron-down"></i>
                </a>
                <div class="collapse ps-4" id="menuCollapse">
                    <a href="#" class="list-group-item list-group-item-action border-0 bg-transparent"><i
                            class="fas fa-utensils me-2"></i>Makanan</a>
                    <a href="#" class="list-group-item list-group-item-action border-0 bg-transparent"><i
                            class="fas fa-coffee me-2"></i>Minuman</a>
                </div>

                <a href="listmeja.html" class="list-group-item list-group-item-action"><i
                        class="fas fa-chair me-2"></i>List
                    Meja</a>
                <a href="#" class="list-group-item list-group-item-action"><i class="fas fa-university me-2"></i>List
                    Bank</a>
            </div>
        </div>

        <!-- Page Content -->
        <div id="page-content-wrapper" class="w-100">
            <nav class="navbar navbar-light bg-white border-bottom justify-content-between px-4 py-3">
                <input class="form-control w-50" type="search" placeholder="Type to search..." aria-label="Search" />
                <div class="d-flex align-items-center">
                    <img src="https://via.placeholder.com/40" class="rounded-circle" alt="Admin" width="40"
                        height="40" />
                    <span class="ms-2 fw-bold">Admin Kasir</span>
                </div>
            </nav>

            <div class="container-fluid px-4 py-4">
                <!-- Tombol Tambah Makanan -->
                <div class="mb-4">
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalTambahMakanan">
                        <i class="fas fa-plus"></i> Tambah Makanan
                    </button>
                </div>

                <!-- Modal Tambah Makanan -->
                <div class="modal fade" id="modalTambahMakanan" tabindex="-1" aria-labelledby="modalTambahMakananLabel"
                    aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">

                            <div class="modal-header">
                                <h5 class="modal-title" id="modalTambahMakananLabel">Tambah Makanan</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                            </div>

                            <form id="formTambahMakanan" enctype="multipart/form-data">
                                <div class="modal-body">

                                    <div class="mb-3">
                                        <label for="namaMakanan" class="form-label">Nama Makanan</label>
                                        <input type="text" class="form-control" id="namaMakanan" name="namaMakanan"
                                            placeholder="Nama Makanan" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="hargaMakanan" class="form-label">Harga Makanan</label>
                                        <div class="input-group">
                                            <span class="input-group-text">Rp</span>
                                            <input type="number" class="form-control" id="hargaMakanan"
                                                name="hargaMakanan" placeholder="Harga Makanan" required>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label for="stokMakanan" class="form-label">Stok</label>
                                        <input type="number" class="form-control" id="stokMakanan" name="stokMakanan"
                                            required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="fotoMakanan" class="form-label">Foto Makanan</label>
                                        <input type="file" class="form-control" id="fotoMakanan" name="fotoMakanan"
                                            accept="image/*" required>
                                    </div>

                                </div>

                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary"
                                        data-bs-dismiss="modal">Close</button>
                                    <button type="submit" class="btn btn-primary">Tambah</button>
                                </div>

                            </form>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    </div>

</body>

</html>
